# Banco SQLite (padrao, sem custo) + API + tunel gratuito.
# PostgreSQL nao e necessario. Suba com:
#   docker compose up -d
#   docker compose --profile tunel up -d   # se TUNNEL_TOKEN estiver no .env

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: madepinus-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_PROVIDER: sqlite
      DATABASE_URL: file:/dados/banco/cortemadepinus.db
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cortemadepinus.netlify.app}
      UPLOAD_DIR: /dados/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      ADMIN_NOME: ${ADMIN_NOME:-Central de Servicos MadePinus}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@madepinus.com.br}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA no arquivo .env}
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      - dados-sqlite:/dados/banco
      - dados-uploads:/dados/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/saude']
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 20s

  backup:
    image: alpine:3.21
    container_name: madepinus-backup
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - dados-sqlite:/dados/banco:ro
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        ts=$$(date +%Y%m%d-%H%M);
        cp /dados/banco/cortemadepinus.db /backups/cortemadepinus-$$ts.db 2>/dev/null || true;
        find /backups -name "cortemadepinus-*.db" -mtime +14 -delete;
        sleep 86400;
      done'

  tunel:
    image: cloudflare/cloudflared:latest
    container_name: madepinus-tunel
    restart: unless-stopped
    profiles: ['tunel']
    depends_on:
      - api
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

volumes:
  dados-sqlite:
  dados-uploads:
